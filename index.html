<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08a66a">
  <title>MyBank — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">
      <div class="brand-icon">M</div>
      <h1>mybank</h1>
      <p>Simple digital wallet demo</p>
    </div>

    <form id="loginForm">
      <label for="phone">Phone number</label>
      <input id="phone" type="tel" inputmode="numeric" autocomplete="username"
             placeholder="07030528292" required>

      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" maxlength="6"
             autocomplete="current-password" placeholder="••••••" required>

      <p id="loginError" class="error" role="alert"></p>
      <button class="primary-btn" type="submit">Login</button>
    </form>

    <div class="demo-note">
      <strong>Demo login</strong>
      <span>Phone: 07030528292</span>
      <span>PIN: 123456</span>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
